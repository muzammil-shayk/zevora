name: ZEVORA CI/CD — Verify & Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: zevora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Strict TypeScript, Zero-Any & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce zero TypeScript `any`
        run: npm run check:no-any

      - name: Run strict TypeScript typecheck
        run: npm run typecheck

      - name: Build Next.js production bundle
        env:
          NEXT_PUBLIC_SITE_URL: https://zevorastores.com
        run: npm run build

  deploy-production:
    name: Deploy Production to Vercel (zevorastores.com)
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Vercel deployment secrets
        id: check_secrets
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_ORG: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_PROJECT: ${{ secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ORG" = "true" ] && [ "$HAS_PROJECT" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set in GitHub Secrets yet — skipping CLI deploy (Vercel Git Integration will still deploy automatically)."
          fi

      - name: Install Vercel CLI
        if: steps.check_secrets.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Production Environment Information
        if: steps.check_secrets.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Prebuilt Vercel Output
        if: steps.check_secrets.outputs.ready == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt Artifacts to Production
        if: steps.check_secrets.outputs.ready == 'true'
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed ZEVORA Production to: $DEPLOY_URL"
